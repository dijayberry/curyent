services:
  - type: web
    name: curuent
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn curyent:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    # Free domain provided by Render: curuent.onrender.com
    # Add custom domains here after purchase, e.g.:
    # domains:
    #   - www.curyent.com
