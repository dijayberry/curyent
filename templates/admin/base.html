<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CURYENT Admin Panel</title>
    <link rel="icon" type="image/png" href="/logo.png"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="/logo.png" alt="CURYENT Logo" class="sidebar-logo">
            <h2>CURYENT Admin</h2>
            <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        </div>

        <nav class="sidebar-nav">
            <a href="/admin/" class="nav-item {% if request.endpoint == 'admin.dashboard' %}active{% endif %}">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="/admin/databases" class="nav-item {% if request.endpoint == 'admin.databases' %}active{% endif %}">
                <i class="fas fa-database"></i>
                <span>Databases</span>
            </a>
            <a href="/admin/users" class="nav-item {% if request.endpoint == 'admin.users' %}active{% endif %}">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>
            <a href="/admin/bookings" class="nav-item {% if request.endpoint == 'admin.bookings' %}active{% endif %}">
                <i class="fas fa-book"></i>
                <span>Bookings</span>
            </a>
            <a href="/admin/ui-settings" class="nav-item {% if request.endpoint == 'admin.ui_settings' %}active{% endif %}">
                <i class="fas fa-palette"></i>
                <span>UI Settings</span>
            </a>
            <a href="/admin/system" class="nav-item {% if request.endpoint == 'admin.system' %}active{% endif %}">
                <i class="fas fa-cogs"></i>
                <span>System</span>
            </a>
            <div class="nav-divider"></div>
            <a href="/" class="nav-item" target="_blank">
                <i class="fas fa-external-link-alt"></i>
                <span>View Site</span>
            </a>
            <a href="/admin/logout" class="nav-item">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="admin-main">
        <!-- Top Bar -->
        <header class="admin-topbar">
            <button class="topbar-toggle" id="topbarToggle"><i class="fas fa-bars"></i></button>
            <h1 class="topbar-title">{% block title %}Admin Panel{% endblock %}</h1>
            <div class="topbar-actions">
                <a href="/" target="_blank" class="topbar-btn" title="View Site">
                    <i class="fas fa-external-link-alt"></i>
                </a>
            </div>
        </header>

        <!-- Page Content -->
        <main class="admin-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/js/admin.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
