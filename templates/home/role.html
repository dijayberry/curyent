<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Role - CURYENT</title>
    <link rel="icon" type="image/png" href="/logo.png"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #2a1545 50%, #1a0a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .role-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(26, 10, 46, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .role-card {
            background: linear-gradient(145deg, #2a1545, #1a0a2e);
            border: 1px solid #8a6baa;
            border-radius: 16px;
            padding: 40px;
            max-width: 700px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .role-card h2 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .role-card h2 i {
            color: #c9a0ff;
            font-size: 32px;
        }

        .role-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .role-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 24px 16px;
            background: rgba(201, 160, 255, 0.08);
            border: 1px solid rgba(201, 160, 255, 0.2);
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .role-item i {
            font-size: 32px;
            color: #c9a0ff;
            transition: transform 0.3s ease;
        }

        .role-item span {
            font-size: 16px;
            font-weight: 500;
        }

        .role-item:hover {
            background: rgba(201, 160, 255, 0.2);
            border-color: #c9a0ff;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(201, 160, 255, 0.2);
        }

        .role-item:hover i {
            transform: scale(1.15);
        }

        .role-close {
            background: linear-gradient(135deg, #8a6baa, #c9a0ff);
            color: #1a0a2e;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .role-close:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(201, 160, 255, 0.3);
        }

        @media (max-width: 600px) {
            .role-card {
                padding: 24px;
            }

            .role-card h2 {
                font-size: 22px;
            }

            .role-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .role-item {
                padding: 18px 12px;
            }

            .role-item i {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <div class="role-overlay">
        <div class="role-card">
            <h2><i class="fas fa-user-circle"></i> Choose Your Role</h2>
            <div class="role-grid">
                <a href="/account/client" class="role-item">
                    <i class="fas fa-user"></i>
                    <span>Client</span>
                </a>
                <a href="/account/djs" class="role-item">
                    <i class="fas fa-music"></i>
                    <span>DJ</span>
                </a>
                <a href="/account/event" class="role-item">
                    <i class="fas fa-calendar-days"></i>
                    <span>Event</span>
                </a>
                <a href="/account/photographer" class="role-item">
                    <i class="fas fa-camera"></i>
                    <span>Photographer</span>
                </a>
                <a href="/account/tents" class="role-item">
                    <i class="fas fa-campground"></i>
                    <span>Tents</span>
                </a>
                <a href="/account/caterer" class="role-item">
                    <i class="fas fa-utensils"></i>
                    <span>Caterer</span>
                </a>
            </div>
            <a href="/" class="role-close"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

</body>
</html>
